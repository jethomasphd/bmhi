<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1612">
<meta name="color-scheme" content="dark">
<title>BMHI — Brief Mental Health Intervention Suite</title>
<meta name="description" content="Evidence-based micro-interventions for job seekers. A population-level behavioral health touchpoint grounded in 30+ years of peer-reviewed research.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1612'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23c4922a' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23c4922a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   BMHI — Brief Mental Health Intervention Suite
   Visual Design System per Seed.md §5
   One warm dark room. Serif voice, mono data, generous quiet.
   Museum-quality. Mobile-first. Every pixel honors the weight.
   ═══════════════════════════════════════════════════════════════ */

/* ─── 1 · TOKENS ─── */
:root {
  /* room */
  --bg: #1a1612;
  --bg2: #201a13;
  --bg3: #251f17;
  --surface: #282117;
  --surface2: #322a1f;
  --border: rgba(240, 236, 228, 0.08);
  --border2: rgba(240, 236, 228, 0.14);
  --shadow-soft: 0 8px 30px rgba(8, 6, 4, 0.35);
  --shadow-deep: 0 24px 70px rgba(8, 6, 4, 0.55);

  /* ink — every text tier ≥ 4.5:1 on --bg */
  --text: #f2eee6;
  --text2: #d8d2c6;
  --dim: #a89f8f;
  --faint: #918878;
  --ink-on-amber: #211a10;

  /* voice */
  --amber: #c4922a;
  --amber-2: #d9a63e;
  --amber-glow: rgba(196, 146, 42, 0.08);
  --amber-dim: rgba(196, 146, 42, 0.14);

  /* tier accents (text-safe on --bg) */
  --sage: #8fb3a2;
  --water: #85a9c0;
  --clay: #c99a82;
  --rose: #c69090;
  --plum: #a98fb5;
  --sage-deep: #7a9e8e;

  /* type */
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  /* motion — slow by design; nothing snappy */
  --ease-gentle: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-breath: cubic-bezier(0.4, 0, 0.2, 1);

  /* chrome */
  --inset-top: env(safe-area-inset-top, 0px);
  --inset-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ─── 2 · ROOM ─── */
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
::selection { background: rgba(196, 146, 42, 0.3); color: var(--text); }
* { scrollbar-width: thin; scrollbar-color: #453e33 transparent; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #453e33; border-radius: 2px; }

/* paper grain */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.42;
}
/* candle-light vignette — wide ramp to avoid banding on dark displays */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 3; pointer-events: none;
  background:
    radial-gradient(150% 120% at 50% 36%, transparent 52%, rgba(10, 8, 5, 0.09) 70%, rgba(10, 8, 5, 0.24) 100%);
}

/* focus — visible, warm, never a blue box */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid rgba(217, 166, 62, 0.75);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ─── 3 · APP SHELL ─── */
.app { height: 100vh; height: 100dvh; width: 100%; position: relative; overflow: hidden; }

/* ─── 4 · FIXED CHROME (dismiss · audio · jobs pill) ─── */
.dismiss, .audio-toggle {
  position: fixed; z-index: 200;
  top: calc(var(--inset-top) + 14px);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(26, 22, 18, 0.55);
  border: 1px solid var(--border);
  color: var(--dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: color 0.3s, border-color 0.3s, background 0.3s, opacity 0.5s ease;
  opacity: 0; pointer-events: none;
  -webkit-tap-highlight-color: transparent;
}
.dismiss { right: calc(env(safe-area-inset-right, 0px) + 14px); font-size: 21px; line-height: 1; font-weight: 300; }
.audio-toggle { left: calc(env(safe-area-inset-left, 0px) + 14px); font-size: 14px; }
.dismiss.vis, .audio-toggle.vis { opacity: 1; pointer-events: auto; }
.dismiss:hover, .dismiss:active { color: var(--text); border-color: var(--border2); background: rgba(38, 32, 25, 0.7); }
.audio-toggle:hover { color: var(--text2); border-color: var(--border2); }
.audio-toggle.on { color: var(--amber-2); border-color: rgba(196, 146, 42, 0.35); }
.audio-toggle:active { color: var(--amber-2); }

/* the one path out — persistent, quiet; loud on post */
.jobs-cta {
  position: fixed; top: calc(var(--inset-top) + 16px); left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  letter-spacing: 0.4px; color: var(--text2);
  background: rgba(26, 22, 18, 0.66);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(196, 146, 42, 0.24);
  border-radius: 999px; padding: 10px 19px;
  text-decoration: none; cursor: pointer;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease, color 0.3s, border-color 0.3s, background 0.3s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.jobs-cta.vis { opacity: 1; pointer-events: auto; }
.jobs-cta:hover {
  color: var(--amber-2);
  border-color: rgba(196, 146, 42, 0.5);
  background: rgba(196, 146, 42, 0.09);
}
.jobs-cta:active { transform: translateX(-50%) scale(0.97); }
.jobs-cta.loud {
  color: var(--amber-2);
  border-color: rgba(196, 146, 42, 0.5);
  background: rgba(196, 146, 42, 0.12);
  font-size: 13px; padding: 11px 22px; font-weight: 600;
  box-shadow: 0 2px 18px rgba(196, 146, 42, 0.18);
}
.jobs-cta.loud:hover { color: var(--text); background: rgba(196, 146, 42, 0.18); border-color: rgba(196, 146, 42, 0.65); }
@media (max-width: 480px) {
  .jobs-cta { font-size: 11px; padding: 9px 15px; }
  .jobs-cta.loud { font-size: 12px; padding: 10px 18px; }
}

/* ─── 5 · STAGE SYSTEM ───
   Each stage is the scroll container. Content lives in .stage-core
   with auto block margins: centered when short, honestly scrollable
   when tall (keyboards, referral cards, long writes). */
.stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: calc(var(--inset-top) + 74px) 24px calc(var(--inset-bottom) + 36px);
  opacity: 0; pointer-events: none;
  visibility: hidden;
  transition: opacity 0.8s ease, visibility 0s linear 0.8s;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.stage.active {
  opacity: 1; pointer-events: auto;
  visibility: visible;
  transition: opacity 0.8s ease, visibility 0s;
}
.stage-core {
  margin-block: auto;
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
}
#interventionContent { max-width: 560px; min-height: 58vh; }
#postContent { max-width: 560px; }
@media (min-width: 768px) {
  .stage { padding-left: 40px; padding-right: 40px; }
}
@media (max-width: 360px) {
  .stage { padding-left: 16px; padding-right: 16px; }
}

/* ─── 6 · WELCOME — the hand on the shoulder ─── */
.welcome::before {
  /* low hearth-light behind the words */
  content: '';
  position: absolute; left: 50%; top: 44%;
  width: min(120vw, 780px); aspect-ratio: 1.6;
  transform: translate(-50%, -50%);
  background: radial-gradient(50% 50% at 50% 50%, rgba(196, 146, 42, 0.055), rgba(196, 146, 42, 0.018) 45%, transparent 72%);
  filter: blur(28px);
  pointer-events: none;
  animation: hearth 9s var(--ease-breath) infinite alternate;
}
.welcome-title {
  font-family: var(--serif);
  font-size: clamp(30px, 7.5vw, 54px);
  font-weight: 300; color: var(--text);
  line-height: 1.22; letter-spacing: -0.01em;
  margin-bottom: 18px;
  opacity: 0; animation: riseFade 1.1s var(--ease-gentle) 0.3s forwards;
}
.welcome-sub {
  font-family: var(--serif);
  font-size: clamp(17px, 4.2vw, 24px);
  font-weight: 300; font-style: italic; color: var(--dim);
  line-height: 1.5; margin-bottom: 56px;
  opacity: 0; animation: riseFade 1.1s var(--ease-gentle) 0.85s forwards;
}
.welcome-btn {
  font-family: var(--serif); font-size: clamp(17px, 4.4vw, 19px);
  font-weight: 400; font-style: italic; color: var(--amber-2);
  background: rgba(196, 146, 42, 0.07);
  border: 1px solid rgba(196, 146, 42, 0.32);
  border-radius: 999px; cursor: pointer; letter-spacing: 0.02em;
  padding: 17px 44px;
  min-height: 56px;
  transition: color 0.3s, background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.2s;
  opacity: 0; animation: riseFade 1.1s var(--ease-gentle) 1.3s forwards;
  -webkit-tap-highlight-color: transparent;
}
.welcome-btn:hover {
  color: var(--text); background: rgba(196, 146, 42, 0.13);
  border-color: rgba(196, 146, 42, 0.55);
  box-shadow: 0 4px 30px rgba(196, 146, 42, 0.14);
}
.welcome-btn:active { transform: scale(0.97); }
.welcome.exiting { opacity: 0; transition: opacity 0.6s ease; }

/* ─── 7 · SHARED VOICE ─── */
.prompt-text {
  font-family: var(--serif);
  font-size: clamp(17px, 4.2vw, 23px);
  font-weight: 300; color: var(--text2); line-height: 1.62;
  max-width: 30em; margin-bottom: 26px;
  text-wrap: balance;
}
.prompt-text em { color: var(--text); font-style: normal; font-weight: 400; }

.prompt-lead {
  /* the asked question — serif, italic, present */
  font-family: var(--serif);
  font-size: clamp(17px, 4.2vw, 21px);
  font-weight: 400; font-style: italic; color: var(--text);
  line-height: 1.55; margin-bottom: 24px;
  max-width: 28em; text-wrap: balance;
}

.closing-text {
  font-family: var(--serif);
  font-size: clamp(17px, 4.2vw, 23px);
  font-weight: 400; color: var(--text); line-height: 1.5;
  max-width: 24em;
  opacity: 0; transition: opacity 1.5s ease;
  text-wrap: balance;
}
.closing-text.vis { opacity: 1; }

.privacy-note {
  font-size: 12px; font-weight: 300; color: var(--faint);
  margin-bottom: 22px; max-width: 24em;
  letter-spacing: 0.02em; line-height: 1.6;
}

.micro-note {
  font-family: var(--serif); font-size: clamp(14px, 3.8vw, 16px);
  font-weight: 400; font-style: italic; color: var(--dim);
  opacity: 0; transition: opacity 0.8s ease; min-height: 24px;
}

.user-echo {
  font-family: var(--serif);
  font-size: clamp(23px, 5.6vw, 34px);
  font-weight: 400; color: var(--text); line-height: 1.4;
  max-width: 16em; margin-bottom: 24px;
  word-break: break-word; text-wrap: balance;
}

/* data voice — mono, precise */
.stat-figure {
  font-family: var(--mono);
  font-size: clamp(38px, 9vw, 56px);
  font-weight: 300; color: var(--amber-2);
  letter-spacing: 0.02em; line-height: 1.1;
  margin-bottom: 10px;
}
.stat-caption {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  letter-spacing: 0.06em; line-height: 1.6;
  margin-bottom: 32px;
}
.pop-number {
  font-family: var(--mono); font-size: clamp(38px, 9.5vw, 60px);
  font-weight: 300; color: var(--amber-2); letter-spacing: 0.04em;
  margin: 20px 0 24px; font-variant-numeric: tabular-nums;
}
.pop-context {
  font-family: var(--sans); font-size: 13.5px; font-weight: 300;
  color: var(--dim); line-height: 1.6; max-width: 24em;
}

/* friend's message — D2 */
.chat-bubble {
  max-width: min(330px, 88vw); width: 100%;
  padding: 17px 20px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px 18px 18px 5px;
  text-align: left;
  font-family: var(--sans); font-size: 14px; font-weight: 300;
  color: var(--text2); line-height: 1.65;
  margin-bottom: 30px;
  box-shadow: var(--shadow-soft);
}

/* ─── 8 · INPUTS ─── */
.mhi-input {
  width: 100%; max-width: 420px;
  font-family: var(--serif); font-size: max(16px, 18px); font-weight: 300;
  color: var(--text); background: transparent;
  border: none; border-bottom: 1px solid var(--border2);
  padding: 14px 4px; outline: none;
  caret-color: var(--amber-2); text-align: center;
  border-radius: 0;
  transition: border-color 0.4s ease;
}
.mhi-input:focus { border-bottom-color: rgba(196, 146, 42, 0.5); }
.mhi-input:focus-visible { outline: none; }
.mhi-input::placeholder { color: var(--faint); font-style: italic; }

.mhi-textarea {
  width: 100%; max-width: 480px; min-height: 140px;
  font-family: var(--serif); font-size: max(16px, 18px); font-weight: 300;
  color: var(--text); background: rgba(40, 33, 23, 0.55);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; outline: none; resize: none;
  caret-color: var(--amber-2); line-height: 1.7;
  transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 2s ease;
}
.mhi-textarea:focus { border-color: rgba(196, 146, 42, 0.3); box-shadow: 0 0 0 3px rgba(196, 146, 42, 0.06); }
.mhi-textarea:focus-visible { outline: none; }
.mhi-textarea::placeholder { color: var(--faint); font-style: italic; }
.mhi-textarea.dissolving {
  opacity: 0; transform: scale(0.985); filter: blur(4px);
  transition: opacity 3s ease, transform 3s ease, filter 3s ease;
}

/* ─── 9 · CHOICES ─── */
.defusion-thoughts {
  display: flex; flex-direction: column; gap: 10px;
  max-width: 390px; width: 100%; margin-bottom: 24px;
}
.thought-btn {
  font-family: var(--serif); font-size: max(16px, 1em); font-weight: 300;
  font-style: italic; color: var(--dim);
  background: rgba(40, 33, 23, 0.35);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 20px;
  min-height: 54px;
  cursor: pointer; text-align: left;
  transition: border-color 0.3s, color 0.3s, background 0.3s, transform 0.2s;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.thought-btn:hover { border-color: var(--border2); color: var(--text2); }
.thought-btn:active { transform: scale(0.985); }
.thought-btn.selected {
  border-color: rgba(196, 146, 42, 0.4); color: var(--text);
  background: rgba(196, 146, 42, 0.06);
}

.action-chips {
  display: flex; flex-direction: column; gap: 10px;
  max-width: 390px; width: 100%;
}
.action-chip {
  font-family: var(--sans); font-size: 14.5px; font-weight: 400;
  color: var(--text2);
  background: rgba(40, 33, 23, 0.35);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 20px;
  min-height: 54px;
  cursor: pointer; text-align: left;
  transition: border-color 0.3s, color 0.3s, background 0.3s, transform 0.2s;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.action-chip:hover { border-color: var(--border2); color: var(--text); }
.action-chip:active { transform: scale(0.985); }
.action-chip.selected {
  border-color: rgba(143, 179, 162, 0.45); color: var(--sage);
  background: rgba(143, 179, 162, 0.06);
}

/* amber ghost pill — "Let it go", shared quiet actions */
.letgo-btn {
  font-family: var(--serif); font-size: 17px; font-weight: 400;
  font-style: italic; color: var(--amber-2);
  background: rgba(196, 146, 42, 0.07);
  border: 1px solid rgba(196, 146, 42, 0.32);
  border-radius: 999px; padding: 14px 36px;
  min-height: 50px;
  cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity 1s ease, background 0.3s, border-color 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.letgo-btn.vis { opacity: 1; pointer-events: auto; }
.letgo-btn:hover { background: rgba(196, 146, 42, 0.13); border-color: rgba(196, 146, 42, 0.55); color: var(--text); }

/* relief point — a quiet path onward, fades in ~15s into any
   open-ended intervention so no one is ever held in the loop.
   Routes through the post stage: fresh-search CTA + partner card. */
.relief-btn {
  font-family: var(--serif); font-size: 15px; font-weight: 400;
  font-style: italic; color: var(--amber-2);
  background: rgba(196, 146, 42, 0.06);
  border: 1px solid rgba(196, 146, 42, 0.28);
  border-radius: 999px; padding: 12px 26px;
  min-height: 46px;
  cursor: pointer; opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease, background 0.3s, border-color 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.relief-btn.vis { opacity: 1; pointer-events: auto; }
.relief-btn:hover { background: rgba(196, 146, 42, 0.12); border-color: rgba(196, 146, 42, 0.5); color: var(--text); }

/* ─── 10 · CHECK-IN (F1) ─── */
.emoji-scale { display: flex; gap: 14px; margin: 26px 0; }
.emoji-btn {
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(40, 33, 23, 0.35);
  border: 1px solid var(--border);
  font-size: 25px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.3s, background 0.3s, transform 0.3s var(--ease-gentle);
  -webkit-tap-highlight-color: transparent;
}
.emoji-btn:hover { border-color: var(--border2); transform: scale(1.1); }
.emoji-btn:active { transform: scale(0.95); }
.emoji-btn.selected {
  border-color: rgba(196, 146, 42, 0.55); background: rgba(196, 146, 42, 0.1);
  transform: scale(1.12);
}
@media (max-width: 400px) {
  .emoji-scale { gap: 9px; }
  .emoji-btn { width: 50px; height: 50px; font-size: 23px; }
}

.referral-card {
  max-width: 390px; width: 100%; text-align: left;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; margin-top: 24px;
  opacity: 0; transition: opacity 1s ease;
  box-shadow: var(--shadow-soft);
}
.referral-card.vis { opacity: 1; }
.referral-card .ref-intro {
  font-family: var(--serif); font-size: 15px; font-style: italic;
  color: var(--dim); margin-bottom: 16px; line-height: 1.6;
}
.referral-link {
  display: block; padding: 13px 16px;
  background: rgba(196, 146, 42, 0.05); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px; text-decoration: none;
  transition: border-color 0.3s, background 0.3s; color: var(--text2);
}
.referral-link:last-child { margin-bottom: 0; }
.referral-link:hover { border-color: rgba(196, 146, 42, 0.3); background: rgba(196, 146, 42, 0.09); }
.referral-link .ref-name { font-size: 13.5px; font-weight: 500; margin-bottom: 3px; color: var(--text); }
.referral-link .ref-detail { font-family: var(--mono); font-size: 11.5px; color: var(--amber-2); letter-spacing: 0.02em; }

/* ─── 11 · BREATH (A1) ─── */
.breath-circle {
  width: clamp(104px, 30vw, 132px); height: clamp(104px, 30vw, 132px);
  border-radius: 50%;
  border: 2px solid var(--sage-deep);
  opacity: 0.3; transform: scale(0.4);
  transition: none;
  position: relative;
}
.breath-circle::after {
  content: ''; position: absolute; inset: 8px;
  border-radius: 50%; border: 1px solid rgba(122, 158, 142, 0.3);
}
.breath-circle.inhale { transform: scale(1); opacity: 0.85; transition: transform 3s var(--ease-breath), opacity 3s ease; }
.breath-circle.hold   { transform: scale(1); opacity: 0.85; transition: none; }
.breath-circle.exhale { transform: scale(0.4); opacity: 0.3; transition: transform 4s var(--ease-breath), opacity 4s ease; }

.breath-halo {
  width: clamp(120px, 40vw, 180px); height: clamp(120px, 40vw, 180px);
  border-radius: 50%; position: relative;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 40px;
}
.breath-halo::before {
  content: ''; position: absolute; inset: -24px; border-radius: 50%;
  background: radial-gradient(circle, rgba(122, 158, 142, 0.07), transparent 70%);
}
.breath-glow {
  position: absolute; inset: -20px; border-radius: 50%;
  background: radial-gradient(circle, rgba(122, 158, 142, 0.07), transparent 70%);
  transition: opacity 2s ease;
}
.breath-label {
  font-family: var(--serif);
  font-size: clamp(19px, 5vw, 23px);
  font-weight: 400; font-style: italic; color: var(--text2);
  opacity: 0; transition: opacity 1s ease; min-height: 34px;
  letter-spacing: 0.01em; padding: 0 16px;
}
.breath-label.vis { opacity: 1; }
.breath-closing {
  font-family: var(--serif);
  font-size: clamp(19px, 5vw, 23px);
  font-weight: 400; color: var(--text); opacity: 0;
  transition: opacity 1.5s ease; margin-top: 32px;
  line-height: 1.4; padding: 0 16px; text-wrap: balance;
}
.breath-closing.vis { opacity: 1; }
.breath-dots { display: flex; gap: 9px; margin-top: 22px; margin-bottom: 12px; transition: opacity 1s ease; }
.breath-dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1px solid rgba(122, 158, 142, 0.35);
  background: transparent; transition: background 0.5s ease, border-color 0.5s ease;
}
.breath-dot.done { background: rgba(143, 179, 162, 0.65); border-color: rgba(143, 179, 162, 0.85); }

/* ─── 12 · BODY SCAN (A2) ─── */
.scan-text {
  font-family: var(--serif); font-size: clamp(21px, 5.2vw, 30px);
  font-weight: 300; font-style: italic; color: var(--text2);
  line-height: 1.45; opacity: 0; min-height: 44px;
  transition: opacity 1.5s ease; text-wrap: balance;
}
.scan-text.vis { opacity: 1; }

/* ─── 13 · QUIET RESET (A3) ─── */
.reset-timer {
  font-family: var(--mono); font-size: clamp(52px, 13vw, 76px);
  font-weight: 300; color: var(--text); letter-spacing: 0.06em;
  margin-bottom: 26px; font-variant-numeric: tabular-nums;
  transition: opacity 1.5s ease;
}
.sound-btns { display: flex; gap: 10px; margin-bottom: 34px; flex-wrap: wrap; justify-content: center; }
.sound-btn {
  font-family: var(--sans); font-size: 12px; font-weight: 400;
  letter-spacing: 0.04em; color: var(--dim);
  background: transparent;
  border: 1px solid var(--border); border-radius: 999px;
  padding: 10px 20px; min-height: 40px; cursor: pointer;
  transition: color 0.3s, border-color 0.3s, background 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.sound-btn.active { color: var(--amber-2); border-color: rgba(196, 146, 42, 0.4); background: rgba(196, 146, 42, 0.06); }
.sound-btn:hover { color: var(--text2); border-color: var(--border2); }

/* ─── 14 · REALITY CHECK (B1) ─── */
.reframe-card {
  max-width: 480px; text-align: left;
  border-left: 2px solid rgba(106, 143, 167, 0.35);
  padding-left: clamp(18px, 5vw, 26px);
  padding-right: 4px;
}
.reframe-card .rf-note {
  font-family: var(--serif); font-size: 15px; font-style: italic;
  color: var(--faint); margin-bottom: 20px;
}
.reframe-card .rf-stat {
  font-family: var(--mono); font-size: clamp(34px, 8vw, 50px);
  font-weight: 300; color: var(--amber-2); margin-bottom: 20px;
  letter-spacing: -0.01em;
}
.reframe-card .rf-body {
  font-family: var(--serif); font-size: clamp(18px, 4.2vw, 24px);
  font-weight: 300; color: var(--text2); line-height: 1.68;
  margin-bottom: 24px;
}
.reframe-card .rf-body em { color: var(--text); font-style: normal; font-weight: 500; }
.reframe-card .rf-close {
  font-family: var(--serif); font-size: clamp(19px, 4.6vw, 22px);
  font-weight: 400; font-style: italic;
  color: var(--text); line-height: 1.5; margin-top: 24px;
}
.reframe-card .rf-source {
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  letter-spacing: 0.05em; margin-top: 18px;
}

/* ─── 15 · MATCH (E1) ─── */
.match-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 9px; width: min(300px, 82vw); margin: 0 auto 24px;
}
.match-card {
  aspect-ratio: 1; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 28px;
  transition: background 0.3s, border-color 0.3s, transform 0.2s, opacity 0.4s;
  -webkit-tap-highlight-color: transparent;
}
.match-card.flipped { background: var(--surface2); border-color: var(--border2); }
.match-card.matched {
  background: rgba(122, 158, 142, 0.09);
  border-color: rgba(122, 158, 142, 0.32);
  opacity: 0.6;
}
.match-card:active { transform: scale(0.95); }

/* ─── 16 · CANVAS GAMES (E3 · E4 · E5 · E6) ─── */
.game-intro {
  font-family: var(--serif);
  font-size: clamp(15px, 4vw, 16.5px);
  font-weight: 400; font-style: italic; color: var(--dim);
  line-height: 1.55; margin-bottom: 20px;
  max-width: 26em; text-wrap: balance;
}
.game-canvas {
  display: block; margin: 0 auto 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  opacity: 0; transition: opacity 0.8s ease;
  max-width: 100%;
}
.game-hint {
  font-family: var(--sans); font-size: 11.5px; color: var(--faint);
  letter-spacing: 0.03em; text-align: center; margin-bottom: 10px;
  opacity: 0; transition: opacity 0.8s ease;
}
.game-controls {
  display: flex; gap: 12px; justify-content: center;
  margin-bottom: 16px;
  opacity: 0; transition: opacity 0.8s ease;
}
.game-btn {
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(40, 33, 23, 0.55);
  border: 1px solid var(--border2);
  color: rgba(217, 166, 62, 0.9);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; user-select: none;
}
.game-btn.wide { width: 76px; border-radius: 999px; touch-action: none; }
.game-btn:hover { border-color: rgba(196, 146, 42, 0.4); }
.game-btn.pressed { background: rgba(196, 146, 42, 0.16); transform: scale(0.94); }

/* ─── 17 · CONFIRMATION ─── */
.confirm-anim { width: 60px; height: 60px; margin-bottom: 20px; }
.confirm-anim .check-path {
  stroke-dasharray: 60; stroke-dashoffset: 60;
  transition: stroke-dashoffset 0.6s ease 0.2s;
}
.confirm-anim.done .check-path { stroke-dashoffset: 0; }

/* ─── 18 · POST — ready for a fresh search ─── */
.post-wrap {
  max-width: 430px; width: 100%;
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 8px 0 24px;
  animation: riseFade 0.7s var(--ease-gentle) 0.1s both;
}
.post-head {
  font-family: var(--serif); font-size: clamp(25px, 5.6vw, 33px);
  font-weight: 400; color: var(--text);
  line-height: 1.25; letter-spacing: -0.01em;
  text-wrap: balance;
}
.post-sub {
  font-family: var(--serif); font-size: clamp(15px, 3.8vw, 17px);
  font-weight: 300; font-style: italic; color: var(--dim);
  line-height: 1.5; margin-bottom: 14px;
}
.post-primary {
  font-family: var(--sans); font-size: 15px; font-weight: 600;
  letter-spacing: 0.02em; color: var(--ink-on-amber);
  background: linear-gradient(180deg, #cf9c30, #c08d26);
  border: 1px solid rgba(217, 166, 62, 0.6);
  border-radius: 999px; padding: 17px 32px;
  min-height: 54px;
  cursor: pointer;
  transition: filter 0.25s, box-shadow 0.25s, transform 0.25s;
  box-shadow: 0 6px 30px rgba(196, 146, 42, 0.24);
  -webkit-tap-highlight-color: transparent;
  max-width: 360px; width: 100%;
}
.post-primary:hover { filter: brightness(1.08); box-shadow: 0 8px 38px rgba(196, 146, 42, 0.34); transform: translateY(-1px); }
.post-primary:active { transform: translateY(0) scale(0.98); }
.post-secondary {
  font-family: var(--serif); font-size: 15px; font-weight: 400;
  font-style: italic; color: var(--dim);
  background: transparent; border: none;
  padding: 9px 14px; min-height: 42px; cursor: pointer;
  transition: color 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.post-secondary:hover { color: var(--text2); }
.post-explore {
  font-family: var(--sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--faint);
  background: transparent; border: none;
  padding: 12px; margin-top: 2px; min-height: 42px;
  cursor: pointer; transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.post-explore:hover { color: var(--dim); }
.post-why {
  font-family: var(--serif); font-size: 14px; font-weight: 400;
  font-style: italic; color: var(--faint);
  text-decoration: none; transition: color 0.3s;
  padding: 4px 8px;
}
.post-why:hover { color: var(--amber-2); }

/* ─── 19 · SPONSORED PARTNER — one quiet card ─── */
.bmhi-ad {
  position: relative;
  width: 100%; max-width: 368px;
  margin-top: 26px;
  padding: 18px 20px 16px 22px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-align: left;
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.bmhi-ad::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
}
.bmhi-ad[data-tint="sage"]::before  { background: rgba(122, 158, 142, 0.55); }
.bmhi-ad[data-tint="water"]::before { background: rgba(106, 143, 167, 0.55); }
.bmhi-ad[data-tint="amber"]::before { background: rgba(196, 146, 42, 0.55); }
.bmhi-ad-tag {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 10px;
}
.bmhi-ad-dismiss {
  position: absolute; top: 6px; right: 6px;
  width: 32px; height: 32px; border-radius: 50%;
  background: transparent; border: none;
  color: var(--faint); font-size: 17px; line-height: 1;
  cursor: pointer; transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.bmhi-ad-dismiss:hover { color: var(--text2); }
.bmhi-ad-brand {
  font-family: var(--serif); font-size: 19px; font-weight: 500;
  color: var(--text); margin-bottom: 4px; letter-spacing: -0.01em;
}
.bmhi-ad-tagline {
  font-family: var(--sans); font-size: 13.5px; font-weight: 400;
  color: var(--text2); line-height: 1.5; margin-bottom: 6px;
}
.bmhi-ad-detail {
  font-family: var(--sans); font-size: 12.5px; font-weight: 300;
  color: var(--dim); line-height: 1.55; margin-bottom: 12px;
}
.bmhi-ad-cta {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--sans); font-size: 12.5px; font-weight: 500;
  letter-spacing: 0.02em; color: var(--amber-2);
  text-decoration: none;
  padding: 6px 0; transition: color 0.2s, gap 0.2s;
}
.bmhi-ad-cta:hover { color: var(--text); }

/* ─── 20 · ALL-RESETS MODAL ─── */
.nav-modal {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(10, 8, 6, 0);
  backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
  pointer-events: none;
  visibility: hidden;
  transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s linear 0.5s;
}
.nav-modal.open {
  pointer-events: auto; visibility: visible;
  background: rgba(10, 8, 6, 0.72);
  backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  transition: background 0.35s ease, backdrop-filter 0.35s ease, visibility 0s;
}
.nav-modal-sheet {
  width: 100%; max-width: 520px;
  max-height: min(82vh, 82dvh); overflow-y: auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-top-left-radius: 24px; border-top-right-radius: 24px;
  padding: 12px 20px calc(var(--inset-bottom) + 30px);
  transform: translateY(100%);
  transition: transform 0.45s var(--ease-gentle);
  -webkit-overflow-scrolling: touch;
  box-shadow: var(--shadow-deep);
}
.nav-modal.open .nav-modal-sheet { transform: translateY(0); }
.nav-modal-grab {
  width: 40px; height: 4px; border-radius: 999px;
  background: var(--border2); margin: 4px auto 12px;
}
@media (min-width: 768px) {
  .nav-modal { align-items: center; padding: 40px; }
  .nav-modal-sheet {
    max-height: 78vh;
    border-radius: 22px;
    padding: 24px 28px 30px;
    transform: translateY(14px);
    opacity: 0;
    transition: transform 0.45s var(--ease-gentle), opacity 0.35s ease;
  }
  .nav-modal.open .nav-modal-sheet { transform: translateY(0); opacity: 1; }
  .nav-modal-grab { display: none; }
}
.nav-modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 14px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.nav-modal-title {
  font-family: var(--serif); font-size: 21px; font-weight: 500;
  color: var(--text); letter-spacing: -0.01em;
}
.nav-modal-close {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--border2); background: transparent;
  color: var(--dim); font-size: 19px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, border-color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-modal-close:hover { color: var(--text); border-color: var(--border2); }
.nav-modal-foot {
  margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.imprint-link {
  font-family: var(--mono); font-size: 9px; font-weight: 400;
  letter-spacing: 0.14em; text-transform: lowercase;
  color: var(--faint); opacity: 0.85;
  text-decoration: none; transition: color 0.3s;
  padding: 6px 10px;
}
.imprint-link:hover { color: var(--amber-2); }
.nav-list { display: flex; flex-direction: column; gap: 20px; }
.nav-tier { display: flex; flex-direction: column; gap: 2px; }
.nav-tier-heading {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--dim);
  padding: 6px; margin-bottom: 2px;
  display: flex; align-items: center; gap: 8px;
}
.nav-tier-heading::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.nav-tier[data-tier="a"] .nav-tier-heading { color: var(--sage); }
.nav-tier[data-tier="b"] .nav-tier-heading { color: var(--water); }
.nav-tier[data-tier="c"] .nav-tier-heading { color: var(--clay); }
.nav-tier[data-tier="d"] .nav-tier-heading { color: var(--rose); }
.nav-tier[data-tier="e"] .nav-tier-heading { color: var(--plum); }
.nav-tier[data-tier="f"] .nav-tier-heading { color: var(--amber-2); }
.nav-item {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
  padding: 13px 12px; border-radius: 12px;
  min-height: 50px;
  cursor: pointer; border: 1px solid transparent; background: transparent;
  color: var(--text2);
  font-family: var(--sans); font-size: 15px; font-weight: 500;
  text-align: left; width: 100%;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.nav-item:hover { background: rgba(240, 236, 228, 0.045); color: var(--text); border-color: var(--border); }
.nav-item:active { background: rgba(240, 236, 228, 0.08); }
.nav-item-name { font-weight: 500; display: inline-flex; align-items: center; gap: 10px; }
.nav-item-name svg { flex: none; opacity: 0.75; }
.nav-item-time {
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  color: var(--faint); letter-spacing: 0.04em;
  flex: none;
}
@media (max-width: 480px) {
  .nav-item { font-size: 14.5px; }
  .nav-modal-title { font-size: 19px; }
}

/* ─── 21 · ABOUT LINK ─── */
.about-link {
  font-family: var(--mono); font-size: 10px; font-weight: 400;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--faint);
  background: none; border: none; cursor: pointer;
  text-decoration: none; transition: color 0.3s;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 8px 10px;
}
.about-link:hover { color: var(--amber-2); }

/* ─── 22 · KEYFRAMES ─── */
@keyframes riseFade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes hearth {
  from { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
}
@keyframes pulse-soft {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
@keyframes float-up {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* ─── 23 · REDUCED MOTION ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .welcome::before { animation: none !important; opacity: 0.7; }
  .welcome-title, .welcome-sub, .welcome-btn,
  .breath-circle, .breath-label, .closing-text,
  .dismiss, .audio-toggle {
    opacity: 1 !important;
    transform: none !important;
    animation: none !important;
  }
}
</style>
</head>

  <!-- DISMISS — always visible per §4.3 -->
  <button class="dismiss" id="dismissBtn" aria-label="Close">&times;</button>

  <!-- JOBS CTA — persistent; refreshes feed with a generic query -->
  <button class="jobs-cta" id="jobsCta" type="button" aria-label="Back to job search">
    <span id="jobsCtaLabel">show me better matches &rarr;</span>

      <path d="M11 5L6 9H2v6h4l5 4V5z"/>

    </div>

  <!-- ═══════════════════════════════════════════
       INTERVENTION STAGE — all interventions render here

  <!-- ═══════════════════════════════════════════
       POST-INTERVENTION
       ═══════════════════════════════════════════ -->
  <div class="stage" id="stagePost">
    <div id="postContent" class="stage-core"></div>
  </div>

</div><!-- .app -->

<!-- ALL-RESETS MODAL (hidden until user taps "See all resets") -->
<div class="nav-modal" id="suiteNav" aria-hidden="true">

    <div class="nav-modal-grab" aria-hidden="true"></div>
    <div class="nav-modal-head">
      <div class="nav-modal-title">All resets</div>
      <button class="nav-modal-close" id="suiteNavClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="nav-list" id="navList"></div>
    <div class="nav-modal-foot">
      <a href="about.html" class="about-link">why this works</a>
      <a href="https://the-companion-dossier.com/Latent_Dialogic_Space/" class="imprint-link" target="_blank" rel="noopener">built using latent dialogic space</a>
    </div>
  </div>
</div>
